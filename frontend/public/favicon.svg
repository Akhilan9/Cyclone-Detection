<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="band2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="band3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Outer spiral band -->
  <path d="M32 6 C48 6, 58 16, 58 32 C58 44, 50 54, 38 56 C30 57, 22 54, 18 48"
        fill="none" stroke="url(#band3)" stroke-width="4.5" stroke-linecap="round"
        opacity="0.6" filter="url(#glow)"/>

  <!-- Middle spiral band -->
  <path d="M18 48 C12 40, 10 30, 14 22 C18 14, 26 10, 34 12 C40 14, 44 20, 44 28"
        fill="none" stroke="url(#band2)" stroke-width="4" stroke-linecap="round"
        opacity="0.8" filter="url(#glow)"/>

  <!-- Inner spiral band -->
  <path d="M44 28 C44 36, 40 42, 34 44 C28 46, 22 42, 22 36 C22 32, 25 28, 30 28"
        fill="none" stroke="url(#band1)" stroke-width="3.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Tightest spiral -->
  <path d="M30 28 C34 28, 37 30, 37 34 C37 37, 35 39, 32 38"
        fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Cyclone eye -->
  <circle cx="32" cy="33" r="4" fill="url(#eye)" filter="url(#eyeGlow)"/>
  <circle cx="32" cy="33" r="1.8" fill="#ffffff" opacity="0.9"/>

  <!-- Subtle cloud wisps -->
  <path d="M8 20 C12 18, 16 20, 14 24" fill="none" stroke="#67e8f9" stroke-width="1.2"
        stroke-linecap="round" opacity="0.3"/>
  <path d="M50 44 C54 42, 56 38, 52 36" fill="none" stroke="#67e8f9" stroke-width="1.2"
        stroke-linecap="round" opacity="0.3"/>
</svg>